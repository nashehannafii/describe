name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
job:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        wirh:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test
        run: bun test
      
      - name: Build
        run: bun run build
        